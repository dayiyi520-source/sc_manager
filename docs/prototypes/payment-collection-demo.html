<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回款管理 | 演示</title>
  <style>
    :root{--page:#0C0F13;--nav:#0B111A;--surface:#121923;--soft:#151A22;--hover:#18212C;--border:#2C3440;--strong:#3A4655;--text:#F8FAFC;--muted:#A5ADBA;--subtle:#7C8796;--primary:#2F66F6;--primary-hover:#3B73FF;--success:#22C55E;--warning:#FACC15;--danger:#F26D5B;--cyan:#35C7E8;--gap-1:4px;--gap-2:8px;--gap-3:12px;--gap-4:16px;--gap-6:24px;--gap-8:32px}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1600px;margin:auto;padding:var(--gap-8)}.topbar{height:56px;background:var(--nav);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--gap-8)}.brand{font-size:16px;font-weight:650}.demo-flag{padding:4px 10px;border:1px solid color-mix(in srgb,var(--warning) 55%,var(--border));color:var(--warning);border-radius:4px;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--gap-6);margin:var(--gap-8) 0 var(--gap-6)}h1{font-size:24px;line-height:32px;margin:0 0 var(--gap-2)}.sub{color:var(--muted)}.actions{display:flex;gap:var(--gap-2);flex-wrap:wrap}.button{border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:36px;padding:7px 14px;border-radius:4px;font:inherit;cursor:pointer;transition:.15s}.button:hover{border-color:var(--strong);background:var(--hover)}.button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary-hover);outline-offset:2px}.button.primary{background:var(--primary);border-color:var(--primary);font-weight:600}.button.primary:hover{background:var(--primary-hover)}.button:disabled{opacity:.45;cursor:not-allowed}.button.danger{color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap-4);margin-bottom:var(--gap-6)}.stat{background:var(--surface);border:1px solid var(--border);padding:var(--gap-4);min-height:112px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:24px;font-weight:650;margin:var(--gap-2) 0;font-variant-numeric:tabular-nums}.stat-note{color:var(--subtle);font-size:12px}.panel{background:var(--surface);border:1px solid var(--border)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-4);padding:var(--gap-4);border-bottom:1px solid var(--border)}.tabs{display:flex;gap:var(--gap-2);flex-wrap:wrap}.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:var(--gap-2) var(--gap-3);font:inherit;cursor:pointer}.tab:hover{color:var(--text);background:var(--soft)}.tab[aria-selected=true]{border-color:var(--primary);color:var(--text)}.search{width:min(360px,100%);height:36px;border:1px solid var(--border);border-radius:4px;background:var(--page);color:var(--text);padding:0 var(--gap-3);font:inherit}.table-wrap{overflow:auto}table{width:100%;min-width:1000px;border-collapse:collapse;text-align:left;font-size:12px}th,td{padding:var(--gap-3);border-bottom:1px solid var(--border);vertical-align:middle}th{white-space:nowrap;background:var(--soft);color:var(--muted);font-weight:600}tbody tr:hover{background:var(--hover)}td{overflow-wrap:anywhere}.money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}.good{color:var(--success)}.warn{color:var(--warning)}.bad{color:var(--danger)}.status{display:inline-flex;padding:3px 8px;border:1px solid var(--border);border-radius:4px;color:var(--muted);white-space:nowrap}.status.good{border-color:color-mix(in srgb,var(--success) 45%,var(--border))}.status.warn{border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}.status.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;top:76px;max-width:min(440px,calc(100vw - 32px));padding:12px 16px;background:var(--soft);border:1px solid var(--strong);border-radius:4px;box-shadow:0 8px 28px #0008;z-index:5}.toast[hidden]{display:none}dialog{width:min(640px,calc(100vw - 32px));border:1px solid var(--strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 20px 60px #0009}dialog::backdrop{background:#0009}.dialog-head,.dialog-foot{padding:var(--gap-4);display:flex;align-items:center;justify-content:space-between;gap:var(--gap-3);border-bottom:1px solid var(--border)}.dialog-foot{border:0;border-top:1px solid var(--border);justify-content:flex-end}.dialog-body{padding:var(--gap-4);display:grid;gap:var(--gap-4)}label{display:grid;gap:var(--gap-2);color:var(--muted);font-size:12px}input,select{width:100%;min-height:38px;border:1px solid var(--border);border-radius:4px;background:var(--page);color:var(--text);padding:8px 10px;font:inherit}input[readonly]{background:var(--soft);color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-4)}.footnote{padding:var(--gap-4);color:var(--subtle);font-size:12px;border-top:1px solid var(--border)}@media(max-width:760px){.shell{padding:var(--gap-4)}.topbar{padding:0 var(--gap-4)}.heading{display:block}.actions{margin-top:var(--gap-4)}.stats{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">综合中心 / 回款管理</div><span class="demo-flag">演示数据 · 本地保存</span></header>
  <main class="shell">
    <section class="heading"><div><h1>回款管理</h1><div class="sub">查看项目应收计划、实际到账与项目资金余额</div></div><div class="actions"><button class="button" id="reset">恢复演示数据</button><button class="button primary" id="newPlan">新建应收计划</button></div></section>
    <section class="stats" id="stats" aria-label="回款汇总"></section>
    <section class="panel"><div class="toolbar"><div class="tabs" role="tablist" aria-label="回款视图"><button class="tab" role="tab" aria-selected="true" data-tab="plans">应收计划</button><button class="tab" role="tab" aria-selected="false" data-tab="records">实际到账</button><button class="tab" role="tab" aria-selected="false" data-tab="overdue">逾期预警</button><button class="tab" role="tab" aria-selected="false" data-tab="projects">项目收支</button></div><input class="search" id="search" type="search" aria-label="搜索计划、客户、合同或项目" placeholder="搜索计划、客户、合同或项目"></div><div id="view"></div><div class="footnote">此文件为独立演示，不连接业务后端；数据仅保存在当前浏览器的回款演示空间。</div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="planDialog"><form id="planForm"><div class="dialog-head"><strong>新建应收计划</strong><button class="button" type="button" data-close>关闭</button></div><div class="dialog-body"><div class="grid"><label>应收类别<select name="category"><option>合同回款</option><option>保证金退回</option><option>维保续费</option></select></label><label>关联项目<select name="project" required></select></label></div><div class="grid"><label>客户<input name="customer" readonly></label><label>收款阶段 / 说明<input name="stage" required maxlength="80" placeholder="例如：项目初验款"></label></div><div class="grid"><label>应收金额（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><label>约定收款日期<input name="dueDate" type="date" required></label></div></div><div class="dialog-foot"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit">保存应收计划</button></div></form></dialog>
  <dialog id="receiptDialog"><form id="receiptForm"><div class="dialog-head"><strong>登记实际到账</strong><button class="button" type="button" data-close>关闭</button></div><div class="dialog-body"><p id="receiptSummary" class="sub"></p><label>本次到账金额（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><label>到账方式<select name="method"><option>银行转账</option><option>网银转账</option><option>商业/银行承兑汇票</option></select></label></div><div class="dialog-foot"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit">确认登记到账</button></div></form></dialog>
  <script>
    const KEY='sc.demo.paymentCollection.v1';
    const projects=[{id:'delivery-project-001',name:'智慧校园一体化平台建设项目',customer:'深圳职业技术大学',paid:0,unpaid:0},{id:'delivery-project-002',name:'在线精品课程资源库建设项目',customer:'金华职业技术大学',paid:80000,unpaid:56400},{id:'delivery-project-003',name:'智慧实训基地升级项目',customer:'浙江工业职业技术学院',paid:0,unpaid:53000}];
    const base={plans:[
      {id:'ar-001',code:'AR-DEMO-2026-001',category:'合同回款',contract:'SC-CT-DEMO-001',projectId:projects[0].id,stage:'第二期（初验款）',amount:1920000,received:1200000,due:'2026-11-30',status:'部分回款'},
      {id:'ar-002',code:'AR-DEMO-2026-002',category:'合同回款',contract:'SC-CT-DEMO-002',projectId:projects[1].id,stage:'项目初验款',amount:680000,received:0,due:'2026-11-12',status:'逾期未还'},
      {id:'ar-003',code:'AR-DEMO-2026-003',category:'保证金退回',contract:'—',projectId:projects[1].id,stage:'招投标保证金退回',amount:25000,received:0,due:'2026-12-05',status:'待回款'},
      {id:'ar-004',code:'AR-DEMO-2026-004',category:'维保续费',contract:'SC-MT-DEMO-003',projectId:projects[2].id,stage:'年度维保续费',amount:120000,received:120000,due:'2026-10-30',status:'已回款'}
    ],records:[
      {id:'rec-001',code:'REC-DEMO-2026-001',planId:'ar-001',amount:700000,date:'2026-10-18',method:'银行转账',serial:'TX-DEMO-AR-001'},
      {id:'rec-002',code:'REC-DEMO-2026-002',planId:'ar-001',amount:500000,date:'2026-11-10',method:'银行转账',serial:'TX-DEMO-AR-002'},
      {id:'rec-003',code:'REC-DEMO-2026-003',planId:'ar-004',amount:120000,date:'2026-10-25',method:'网银转账',serial:'TX-DEMO-AR-003'}
    ]};
    let data=load(),tab='plans',receiptPlan=null,timer;
    function cloneBase(){return JSON.parse(JSON.stringify(base))}function load(){try{const raw=localStorage.getItem(KEY);if(!raw){const initial=cloneBase();localStorage.setItem(KEY,JSON.stringify(initial));return initial}const parsed=JSON.parse(raw);return Array.isArray(parsed.plans)&&Array.isArray(parsed.records)?parsed:cloneBase()}catch{return cloneBase()}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{notify('保存失败，请检查浏览器存储空间。');return false}}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '¥ '+Number(v||0).toLocaleString('zh-CN')}function proj(id){return projects.find(p=>p.id===id)||{name:'未关联项目',customer:'—'}}
    function notify(text){const t=document.querySelector('#toast');t.textContent=text;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2800)}
    function stat(label,value,note,cls=''){return `<article class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div><div class="stat-note">${note}</div></article>`}
    function renderStats(){const total=data.plans.reduce((s,p)=>s+p.amount,0),received=data.plans.reduce((s,p)=>s+p.received,0),open=data.plans.reduce((s,p)=>s+p.amount-p.received,0),overdue=data.plans.filter(p=>p.amount>p.received&&p.due<'2026-11-16').length;document.querySelector('#stats').innerHTML=stat('应收计划总额',money(total),`${data.plans.length} 笔计划`)+stat('累计实际到账',money(received),`${data.records.length} 笔到账记录`,'good')+stat('未收余额',money(open),`${overdue} 笔逾期`,overdue?'warn':'')}
    function rowPlan(p){const q=proj(p.projectId),left=Math.max(0,p.amount-p.received),tone=p.status==='已回款'?'good':p.status.includes('逾期')?'bad':p.status.includes('部分')?'warn':'';return `<tr><td>${esc(p.code)}</td><td>${esc(p.category)}</td><td>${esc(p.contract||'—')}</td><td>${esc(q.name)}<br><span class="stat-note">${esc(q.customer)}</span></td><td>${esc(p.stage)}</td><td class="money">${money(p.amount)}</td><td class="money good">${money(p.received)}</td><td class="money ${left?'warn':''}">${money(left)}</td><td>${esc(p.due)}</td><td><span class="status ${tone}">${esc(p.status)}</span></td><td>${left?`<button class="button" data-receive="${esc(p.id)}">登记到账</button>`:'已收讫'}</td></tr>`}
    function table(headers,rows,empty){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}
    function render(){renderStats();document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const query=document.querySelector('#search').value.trim().toLowerCase();let html='';if(tab==='plans'||tab==='overdue'){let list=data.plans.filter(p=>tab!=='overdue'||(p.amount>p.received&&p.due<'2026-11-16')).filter(p=>[p.code,p.category,p.contract,p.stage,proj(p.projectId).name,proj(p.projectId).customer].join(' ').toLowerCase().includes(query));html=table(['计划编号','类别','关联合同','关联项目 / 客户','收款阶段','计划金额','已到账','未收余额','约定日期','状态','操作'],list.map(rowPlan),query?'暂无匹配的应收计划':tab==='overdue'?'暂无逾期应收':'暂无应收计划')}else if(tab==='records'){const list=data.records.filter(r=>{const p=data.plans.find(x=>x.id===r.planId);return [r.code,r.serial,r.method,p?.code,p?.stage,p?proj(p.projectId).customer:''].join(' ').toLowerCase().includes(query)});html=table(['到账流水号','计划编号','客户','到账金额','到账方式','到账日期','银行流水号'],list.map(r=>{const p=data.plans.find(x=>x.id===r.planId);return `<tr><td>${esc(r.code)}</td><td>${esc(p?.code||'—')}</td><td>${esc(p?proj(p.projectId).customer:'—')}</td><td class="money good">${money(r.amount)}</td><td>${esc(r.method)}</td><td>${esc(r.date)}</td><td>${esc(r.serial)}</td></tr>`}),query?'暂无匹配的到账记录':'暂无到账记录')}else{const rows=projects.map(p=>{const plans=data.plans.filter(x=>x.projectId===p.id),got=plans.reduce((s,x)=>s+x.received,0),open=plans.reduce((s,x)=>s+x.amount-x.received,0);return `<tr><td>${esc(p.name)}<br><span class="stat-note">${esc(p.customer)}</span></td><td class="money good">${money(got)}</td><td class="money">${money(p.paid)}</td><td class="money">${money(got-p.paid)}</td><td class="money warn">${money(open)}</td><td class="money warn">${money(p.unpaid)}</td><td class="money">${money(open-p.unpaid)}</td></tr>`});html=table(['项目 / 客户','累计实收','累计实付','实际净流入','未收余额','未付余额','预计净流入'],rows,projects.length?'暂无项目收支':'暂无项目')}document.querySelector('#view').innerHTML=html}
    function populateProjects(){const select=document.querySelector('[name=project]');select.innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');document.querySelector('[name=customer]').value=proj(select.value).customer;select.addEventListener('change',()=>document.querySelector('[name=customer]').value=proj(select.value).customer)}
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.querySelector('#search').addEventListener('input',render);document.querySelector('#newPlan').addEventListener('click',()=>document.querySelector('#planDialog').showModal());document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));populateProjects();render();
    document.querySelector('#reset').addEventListener('click',()=>{data=cloneBase();if(save()){tab='plans';document.querySelector('#search').value='';render();notify('演示数据已恢复。')}});
    document.querySelector('#view').addEventListener('click',e=>{const b=e.target.closest('[data-receive]');if(!b)return;receiptPlan=data.plans.find(p=>p.id===b.dataset.receive);if(!receiptPlan)return;const remaining=receiptPlan.amount-receiptPlan.received;document.querySelector('#receiptSummary').textContent=`${proj(receiptPlan.projectId).name} · ${receiptPlan.stage} · 未收余额 ${money(remaining)}`;const input=document.querySelector('#receiptForm [name=amount]');input.max=remaining;input.value=remaining;document.querySelector('#receiptDialog').showModal()});
    document.querySelector('#planForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),amount=Number(f.get('amount')),project=proj(f.get('project'));data.plans.unshift({id:`ar-${Date.now()}`,code:`AR-DEMO-${Date.now()}`,category:f.get('category'),contract:'—',projectId:f.get('project'),stage:String(f.get('stage')).trim(),amount,received:0,due:f.get('dueDate'),status:f.get('dueDate')<'2026-11-16'?'逾期未还':'待回款'});if(save()){e.currentTarget.reset();populateProjects();document.querySelector('#planDialog').close();render();notify('应收计划已建立。')}});
    document.querySelector('#receiptForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number(new FormData(e.currentTarget).get('amount')),remaining=receiptPlan.amount-receiptPlan.received;if(!amount||amount<=0||amount>remaining){notify('到账金额必须大于 0 且不能超过未收余额。');return}const before=JSON.stringify(data);receiptPlan.received+=amount;receiptPlan.status=receiptPlan.received>=receiptPlan.amount?'已回款':'部分回款';data.records.unshift({id:`rec-${Date.now()}`,code:`REC-DEMO-${Date.now()}`,planId:receiptPlan.id,amount,date:new Date().toISOString().slice(0,10),method:new FormData(e.currentTarget).get('method'),serial:`TX-DEMO-${Date.now()}`});if(save()){document.querySelector('#receiptDialog').close();render();notify('到账记录已登记。')}else data=JSON.parse(before)});
  </script>
</body>
</html>
