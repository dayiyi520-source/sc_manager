<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>付款管理 | 演示</title>
  <style>
    :root{--page:#0C0F13;--nav:#0B111A;--surface:#121923;--soft:#151A22;--hover:#18212C;--border:#2C3440;--strong:#3A4655;--text:#F8FAFC;--muted:#A5ADBA;--subtle:#7C8796;--primary:#2F66F6;--primary-hover:#3B73FF;--success:#22C55E;--warning:#FACC15;--danger:#F26D5B;--gap-1:4px;--gap-2:8px;--gap-3:12px;--gap-4:16px;--gap-6:24px;--gap-8:32px}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}.topbar{height:56px;background:var(--nav);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font-size:16px;font-weight:650}.demo-flag{padding:4px 10px;border:1px solid color-mix(in srgb,var(--warning) 55%,var(--border));color:var(--warning);border-radius:4px;font-size:12px}.shell{max-width:1600px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:0 0 24px}h1{font-size:24px;line-height:32px;margin:0 0 8px}.sub{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:36px;padding:7px 14px;border-radius:4px;font:inherit;cursor:pointer;transition:.15s}.button:hover{border-color:var(--strong);background:var(--hover)}.button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary-hover);outline-offset:2px}.button.primary{background:var(--primary);border-color:var(--primary);font-weight:600}.button.primary:hover{background:var(--primary-hover)}.button:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.stat{background:var(--surface);border:1px solid var(--border);padding:16px;min-height:112px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:24px;font-weight:650;margin:8px 0;font-variant-numeric:tabular-nums}.stat-note{color:var(--subtle);font-size:12px}.panel{background:var(--surface);border:1px solid var(--border)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border-bottom:1px solid var(--border)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer}.tab:hover{color:var(--text);background:var(--soft)}.tab[aria-selected=true]{border-color:var(--primary);color:var(--text)}.search{width:min(360px,100%);height:36px;border:1px solid var(--border);border-radius:4px;background:var(--page);color:var(--text);padding:0 12px;font:inherit}.table-wrap{overflow:auto}table{width:100%;min-width:1080px;border-collapse:collapse;text-align:left;font-size:12px}th,td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}th{white-space:nowrap;background:var(--soft);color:var(--muted);font-weight:600}tbody tr:hover{background:var(--hover)}td{overflow-wrap:anywhere}.money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}.good{color:var(--success)}.warn{color:var(--warning)}.bad{color:var(--danger)}.status{display:inline-flex;padding:3px 8px;border:1px solid var(--border);border-radius:4px;color:var(--muted);white-space:nowrap}.status.good{border-color:color-mix(in srgb,var(--success) 45%,var(--border))}.status.warn{border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}.status.bad{border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}.empty{padding:56px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;top:76px;max-width:min(440px,calc(100vw - 32px));padding:12px 16px;background:var(--soft);border:1px solid var(--strong);border-radius:4px;box-shadow:0 8px 28px #0008;z-index:5}.toast[hidden]{display:none}dialog{width:min(640px,calc(100vw - 32px));border:1px solid var(--strong);border-radius:6px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 20px 60px #0009}dialog::backdrop{background:#0009}.dialog-head,.dialog-foot{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border)}.dialog-foot{border:0;border-top:1px solid var(--border);justify-content:flex-end}.dialog-body{padding:16px;display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:8px;color:var(--muted);font-size:12px}input,select{width:100%;min-height:38px;border:1px solid var(--border);border-radius:4px;background:var(--page);color:var(--text);padding:8px 10px;font:inherit}input[readonly]{background:var(--soft);color:var(--muted)}.footnote{padding:16px;color:var(--subtle);font-size:12px;border-top:1px solid var(--border)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{padding:16px}.topbar{padding:0 16px}.heading{display:block}.actions{margin-top:16px}.stats{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">综合中心 / 付款管理</div><span class="demo-flag">演示数据 · 本地保存</span></header>
  <main class="shell">
    <section class="heading"><div><h1>付款管理</h1><div class="sub">管理项目付款计划、付款记录与到期事项</div></div><div class="actions"><button class="button" id="reset">恢复演示数据</button><button class="button primary" id="newPayable">新建付款计划</button></div></section>
    <section class="stats" id="stats" aria-label="付款汇总"></section>
    <section class="panel"><div class="toolbar"><div class="tabs" role="tablist" aria-label="付款管理视图"><button class="tab" role="tab" aria-selected="true" data-tab="ledger">应付台账</button><button class="tab" role="tab" aria-selected="false" data-tab="payments">付款记录</button><button class="tab" role="tab" aria-selected="false" data-tab="overdue">到期预警</button></div><input class="search" id="search" type="search" aria-label="搜索付款管理" placeholder="搜索付款单、收款客户、合同或项目"></div><div id="view"></div><div class="footnote">此文件为独立演示，不连接业务后端；数据仅保存在当前浏览器的付款演示空间。</div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="payableDialog"><form id="payableForm"><div class="dialog-head"><strong>新建付款计划</strong><button class="button" type="button" data-close>关闭</button></div><div class="dialog-body"><div class="grid"><label>付款类型<select name="category"><option>运营中心分成</option><option>投标报名费</option><option>投标保证金</option><option>中标服务费</option><option>专家评审费</option><option>投标平台服务费</option><option>履约保证金</option><option>质保金</option><option>第三方采购</option></select></label><label>关联项目<select name="project" required></select></label></div><div class="grid"><label>收款客户<input name="customer" readonly></label><label>关联合同<input name="contract" maxlength="60" placeholder="可不填写"></label></div><div class="grid"><label>付款金额（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><label>计划付款日期<input name="dueDate" type="date" required></label></div></div><div class="dialog-foot"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit">保存付款计划</button></div></form></dialog>
  <dialog id="paymentDialog"><form id="paymentForm"><div class="dialog-head"><strong>登记付款</strong><button class="button" type="button" data-close>关闭</button></div><div class="dialog-body"><p id="paymentSummary" class="sub"></p><label>本次付款金额（元）<input name="amount" type="number" min="0.01" step="0.01" required></label><label>付款方式<select name="method"><option>银行转账</option><option>网银支付</option><option>商业承兑汇票</option></select></label></div><div class="dialog-foot"><button class="button" type="button" data-close>取消</button><button class="button primary" type="submit">确认登记付款</button></div></form></dialog>
  <script>
    const KEY='sc.demo.paymentManagement.v1';const projects=[{id:'delivery-project-001',name:'智慧校园一体化平台建设项目',customer:'深圳职业技术大学'},{id:'delivery-project-002',name:'在线精品课程资源库建设项目',customer:'金华职业技术大学'},{id:'delivery-project-003',name:'智慧实训基地升级项目',customer:'浙江工业职业技术学院'}];
    const base={payables:[{id:'ap-001',code:'AP-DEMO-2026-001',category:'第三方采购',customer:'金华职业技术大学',projectId:projects[1].id,contract:'SC-CT-DEMO-002',amount:86400,paid:30000,due:'2026-11-20',status:'部分付款'},{id:'ap-002',code:'AP-DEMO-2026-002',category:'第三方采购',customer:'浙江工业职业技术学院',projectId:projects[2].id,contract:'SC-CT-DEMO-003',amount:53000,paid:0,due:'2026-11-08',status:'逾期'},{id:'ap-003',code:'AP-DEMO-2026-003',category:'投标保证金',customer:'金华职业技术大学',projectId:projects[1].id,contract:'—',amount:50000,paid:50000,due:'2026-09-30',status:'已结清'}],payments:[{id:'pay-001',code:'APP-DEMO-2026-001',payableId:'ap-001',amount:30000,method:'银行转账',date:'2026-10-28',serial:'TX-DEMO-26001'},{id:'pay-002',code:'APP-DEMO-2026-002',payableId:'ap-003',amount:50000,method:'银行转账',date:'2026-09-25',serial:'TX-DEMO-26002'}]};
    let data=load(),tab='ledger',activePayable=null,timer;function cloneBase(){return JSON.parse(JSON.stringify(base))}function load(){try{const raw=localStorage.getItem(KEY);if(!raw){const initial=cloneBase();localStorage.setItem(KEY,JSON.stringify(initial));return initial}const parsed=JSON.parse(raw);return Array.isArray(parsed.payables)&&Array.isArray(parsed.payments)?parsed:cloneBase()}catch{return cloneBase()}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{notify('保存失败，请检查浏览器存储空间。');return false}}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '¥ '+Number(v||0).toLocaleString('zh-CN')}function proj(id){return projects.find(p=>p.id===id)||{name:'未关联项目',customer:'—'}}function left(p){return Math.max(0,p.amount-p.paid)}function status(p){if(left(p)===0)return '已结清';if(p.due<'2026-11-16')return '逾期';return p.paid?'部分付款':'待付款'}function notify(text){const t=document.querySelector('#toast');t.textContent=text;t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,2800)}
    function stat(label,value,note,cls=''){return `<article class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div><div class="stat-note">${note}</div></article>`}function renderStats(){const total=data.payables.reduce((s,p)=>s+p.amount,0),paid=data.payables.reduce((s,p)=>s+p.paid,0),open=data.payables.reduce((s,p)=>s+left(p),0),overdue=data.payables.filter(p=>left(p)>0&&p.due<'2026-11-16').length;document.querySelector('#stats').innerHTML=stat('应付总额',money(total),`${data.payables.length} 笔付款计划`)+stat('已付款总额',money(paid),`${data.payments.length} 笔付款记录`,'good')+stat('待付款余额',money(open),'当前未结清金额','warn')+stat('逾期应付款',money(data.payables.filter(p=>left(p)>0&&p.due<'2026-11-16').reduce((s,p)=>s+left(p),0)),`${overdue} 笔超过付款日期`,overdue?'bad':'')}
    function tone(p){return left(p)===0?'good':p.due<'2026-11-16'?'bad':p.paid?'warn':''}function table(headers,rows,empty){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}function rowPayable(p){const q=proj(p.projectId),balance=left(p),s=status(p);return `<tr><td>${esc(p.code)}</td><td>${esc(p.category)}</td><td>${esc(p.customer)}</td><td>${esc(q.name)}<br><span class="stat-note">${esc(q.customer)}</span></td><td>${esc(p.contract||'—')}</td><td class="money">${money(p.amount)}</td><td class="money good">${money(p.paid)}</td><td class="money ${balance?'warn':''}">${money(balance)}</td><td>${esc(p.due)}</td><td><span class="status ${tone(p)}">${esc(s)}</span></td><td>${balance?`<button class="button" data-pay="${esc(p.id)}">登记付款</button>`:'已结清'}</td></tr>`}
    function render(){renderStats();document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));const query=document.querySelector('#search').value.trim().toLowerCase();let html='';if(tab==='ledger'||tab==='overdue'){const list=data.payables.filter(p=>tab!=='overdue'||(left(p)>0&&p.due<'2026-11-16')).filter(p=>[p.code,p.category,p.customer,p.contract,proj(p.projectId).name].join(' ').toLowerCase().includes(query));html=table(['应付单号','付款类型','收款客户','关联项目 / 客户','关联合同','应付金额','已付款','未付款余额','到期日','状态','操作'],list.map(rowPayable),query?'暂无匹配的付款计划':tab==='overdue'?'暂无逾期应付款':'暂无付款计划')}else{const list=data.payments.filter(r=>{const p=data.payables.find(x=>x.id===r.payableId);return [r.code,r.serial,r.method,p?.code,p?.customer,p?proj(p.projectId).name:''].join(' ').toLowerCase().includes(query)});html=table(['付款流水号','应付单号','收款客户','关联项目','付款金额','付款方式','付款日期','银行流水号'],list.map(r=>{const p=data.payables.find(x=>x.id===r.payableId);return `<tr><td>${esc(r.code)}</td><td>${esc(p?.code||'—')}</td><td>${esc(p?.customer||'—')}</td><td>${esc(p?proj(p.projectId).name:'—')}</td><td class="money good">${money(r.amount)}</td><td>${esc(r.method)}</td><td>${esc(r.date)}</td><td>${esc(r.serial)}</td></tr>`}),query?'暂无匹配的付款记录':'暂无付款记录')}document.querySelector('#view').innerHTML=html}
    function populateProjects(){const select=document.querySelector('[name=project]');select.innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');document.querySelector('[name=customer]').value=proj(select.value).customer;select.addEventListener('change',()=>document.querySelector('[name=customer]').value=proj(select.value).customer)}const payableCategory=document.querySelector('#payableForm [name=category]'),payableContract=document.querySelector('#payableForm [name=contract]');function syncContractRequirement(){const required=payableCategory.value==='运营中心分成';payableContract.required=required;payableContract.placeholder=required?'分成业务必须关联合同':'可不填写'}payableCategory.addEventListener('change',syncContractRequirement);syncContractRequirement();document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.querySelector('#search').addEventListener('input',render);document.querySelector('#newPayable').addEventListener('click',()=>document.querySelector('#payableDialog').showModal());document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));populateProjects();render();
    document.querySelector('#reset').addEventListener('click',()=>{data=cloneBase();if(save()){tab='ledger';document.querySelector('#search').value='';render();notify('演示数据已恢复。')}});document.querySelector('#payableForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),amount=Number(f.get('amount')),p=proj(f.get('project'));data.payables.unshift({id:`ap-${Date.now()}`,code:`AP-DEMO-${Date.now()}`,category:f.get('category'),customer:p.customer,projectId:f.get('project'),contract:String(f.get('contract')).trim()||'—',amount,paid:0,due:f.get('dueDate'),status:f.get('dueDate')<'2026-11-16'?'逾期':'待付款'});if(save()){e.currentTarget.reset();populateProjects();document.querySelector('#payableDialog').close();render();notify('付款计划已建立。')}});
    document.querySelector('#view').addEventListener('click',e=>{const b=e.target.closest('[data-pay]');if(!b)return;activePayable=data.payables.find(p=>p.id===b.dataset.pay);if(!activePayable)return;const balance=left(activePayable);document.querySelector('#paymentSummary').textContent=`${activePayable.code} · ${proj(activePayable.projectId).name} · 未付款余额 ${money(balance)}`;const input=document.querySelector('#paymentForm [name=amount]');input.max=balance;input.value=balance;document.querySelector('#paymentDialog').showModal()});document.querySelector('#paymentForm').addEventListener('submit',e=>{e.preventDefault();if(!activePayable)return;const f=new FormData(e.currentTarget),amount=Number(f.get('amount')),balance=left(activePayable);if(!amount||amount<=0||amount>balance){notify('付款金额必须大于 0 且不能超过未付款余额。');return}const before=JSON.stringify(data);activePayable.paid+=amount;activePayable.status=status(activePayable);data.payments.unshift({id:`pay-${Date.now()}`,code:`APP-DEMO-${Date.now()}`,payableId:activePayable.id,amount,method:f.get('method'),date:new Date().toISOString().slice(0,10),serial:`TX-DEMO-${Date.now()}`});if(save()){document.querySelector('#paymentDialog').close();render();notify('付款记录已登记。')}else data=JSON.parse(before)});
  </script>
</body>
</html>
